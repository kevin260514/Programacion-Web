spring.application.name=tienda-textil
server.port=8080

# Base de datos H2 en archivo: se crea sola en la carpeta ./data
# No requiere instalar nada en otra maquina
spring.datasource.url=jdbc:h2:file:./data/tiendatextildb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
