server.port=8080

# Base de datos H2 en archivo (los datos se guardan en ./data/productosdb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/productosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Configuración de Spring AI con Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3