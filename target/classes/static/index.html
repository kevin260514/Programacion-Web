<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda Textil</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f3f0; margin: 0; padding: 20px; }
        .contenedor { max-width: 800px; margin: 0 auto; }
        .caja { background: #fff; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
        input { padding: 8px; margin: 4px 4px 4px 0; }
        button { padding: 8px 12px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Tienda Textil</h1>

    <div class="caja">
        <h3 id="titulo">Nuevo producto</h3>
        <form id="formulario">
            <input type="hidden" id="id">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="tipo" placeholder="Tipo (Tela, Jean...)" required>
            <input type="number" id="precio" placeholder="Precio" step="0.01" min="0" required>
            <input type="number" id="stock" placeholder="Stock" min="0" required>
            <button type="submit">Guardar</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>
    </div>

    <div class="caja">
        <h3>Productos</h3>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
        <p>Valor total del inventario: $<span id="total">0.00</span></p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
